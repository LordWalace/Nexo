name: Backend Tests

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: nexo_user
          POSTGRES_PASSWORD: nexo_password
          POSTGRES_DB: nexo_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nexo_user -d nexo_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_NAME: Nexo API
      APP_SLUG: nexo
      APP_ENV: test
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://nexo_user:nexo_password@localhost:5432/nexo_db
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: test-secret
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "30"
      PYTHONPATH: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Create virtual environment
        run: python -m venv backend/.venv

      - name: Upgrade pip
        run: backend/.venv/bin/python -m pip install --upgrade pip

      - name: Install production dependencies
        run: backend/.venv/bin/python -m pip install -r backend/requirements.txt

      - name: Install development dependencies
        run: backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt

      - name: Run Ruff
        run: backend/.venv/bin/python -m ruff check backend/app tests

      - name: Run MyPy
        run: backend/.venv/bin/python -m mypy backend/app

      - name: Run Pytest
        run: >-
          backend/.venv/bin/python -m pytest tests
          -v
          --cov=backend/app
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80

      - name: Run Dependency Audit
        run: backend/.venv/bin/python -m pip_audit